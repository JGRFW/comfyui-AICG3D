name: Publish to Comfy Registry

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

concurrency:
  group: comfy-registry-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Preserve non-ASCII package paths
        run: git config --global core.quotepath false

      - name: Check Registry token
        id: registry-token
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          if [ -n "$REGISTRY_ACCESS_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Comfy Registry not configured::Add REGISTRY_ACCESS_TOKEN in repository Actions secrets."
          fi

      - name: Publish custom node
        if: steps.registry-token.outputs.configured == 'true'
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}

      - name: Verify Registry package contents
        if: steps.registry-token.outputs.configured == 'true'
        shell: bash
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          python - "${VERSION}" <<'PY'
          import io
          import sys
          import time
          import urllib.request
          import zipfile

          version = sys.argv[1]
          url = f"https://cdn.comfy.org/aicg3d/aicg3d-h3-suite/{version}/node.zip"
          last_error = None
          for _ in range(18):
              try:
                  with urllib.request.urlopen(url, timeout=60) as response:
                      payload = response.read()
                  break
              except Exception as exc:
                  last_error = exc
                  time.sleep(5)
          else:
              raise RuntimeError(f"Registry package was not available: {last_error}")

          with zipfile.ZipFile(io.BytesIO(payload)) as archive:
              names = set(archive.namelist())
          required = {
              "web/minimax_h3_easy_ui_v4.js",
              "web/aicg3d_prompt_split.js",
              "aicg3d_h3easy/nodes.py",
              "pyproject.toml",
              "LICENSE",
          }
          missing = sorted(required - names)
          workflows = sorted(name for name in names if name.startswith("workflows/") and name.endswith(".json"))
          last_error = None
          for attempt in range(1, 37):
              if not missing and len(workflows) >= 9:
                  print(f"Verified {len(names)} files and {len(workflows)} workflows")
                  break
              last_error = RuntimeError(
                  f"incomplete package: missing={missing}, workflows={len(workflows)}"
              )
              print(f"Verification attempt {attempt}/36 failed: {last_error}")
              if attempt >= 36:
                  raise RuntimeError(f"Registry package verification failed: {last_error}")
              time.sleep(10)
              with urllib.request.urlopen(url, timeout=60) as response:
                  payload = response.read()
              with zipfile.ZipFile(io.BytesIO(payload)) as archive:
                  names = set(archive.namelist())
              missing = sorted(required - names)
              workflows = sorted(name for name in names if name.startswith("workflows/") and name.endswith(".json"))
          PY
